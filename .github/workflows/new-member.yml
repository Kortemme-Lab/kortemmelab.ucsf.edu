name: New lab member

# When someone opens (or edits) a "New lab member" issue with the .zip from
# the profile form attached, this checks the .zip, adds them on a branch of
# their own, and opens a pull request. A website manager merges it to
# publish; build-site.yml then rebuilds the website. The outcome -- the pull
# request, or what to fix -- is posted as a comment on the issue, and kept up
# to date if they attach a new .zip.
#
# Nothing here can change main: it only pushes a new-member/issue-N branch.
# The issue's text never reaches a shell command; scripts/new-member-issue.py
# reads it from the environment. See intake/github-issue-route.md.

on:
  issues:
    types: [opened, edited, reopened]

# One run per issue; a newer edit replaces a run still in progress.
concurrency:
  group: new-member-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  submit:
    # Only open "New lab member" issues, from people with access to the repository.
    if: >-
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.labels.*.name, 'new-member') ||
       startsWith(github.event.issue.title, 'New lab member')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # push the new-member/issue-N branch
      pull-requests: write     # open the pull request
      issues: write            # comment and label
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      # Only needed if GitHub won't let the workflow's own token read issue
      # attachments; the issue comment says so if that happens.
      INTAKE_TOKEN: ${{ secrets.INTAKE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the .zip from the issue
        id: fetch
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/new-member-issue.py fetch

      - name: Check it
        id: check
        if: steps.fetch.outputs.zip != ''
        run: python3 scripts/new-member-issue.py check

      - name: Add them on a branch
        if: steps.check.outputs.ok == 'true'
        run: |
          branch="new-member/issue-$ISSUE_NUMBER"
          git switch -c "$branch"
          python3 scripts/add-person.py --zip "$RUNNER_TEMP/submission.zip"
          # Make sure the site still builds with them on it. docs/ itself is
          # left out of the pull request: it's rebuilt once this is merged,
          # so two people's pull requests can't collide in the generated pages.
          python3 scripts/build-site.py
          git checkout -- docs
          git clean -fdq docs
          git add content
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Add a new lab member, from issue #$ISSUE_NUMBER" \
                        -m "From the profile form, via .github/workflows/new-member.yml."
          git push --force origin "$branch"

      - name: Open or update the pull request
        if: steps.check.outputs.ok == 'true'
        run: python3 scripts/new-member-issue.py pr

      - name: Report back on the issue
        if: always()
        run: python3 scripts/new-member-issue.py comment
