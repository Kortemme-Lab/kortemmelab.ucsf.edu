name: Profile submission

# Handles "New lab member", "Update my profile" and "Add papers" issues. When
# one is opened (or edited), this reads what it holds -- the .zip from the
# profile form, or for Add papers a name and some DOIs -- checks it, makes the change
# on a branch of its own, and opens a pull request. A website manager merges
# it to publish; build-site.yml then rebuilds the website. The outcome (the
# pull request, or what to fix) is posted as a comment on the issue, and
# kept up to date if they edit it.
#
# Nothing here can change main: it only pushes a profile/issue-N branch. The
# issue's text never reaches a shell command; scripts/profile-issue.py reads
# it from the environment. See intake/github-issue-route.md.

on:
  issues:
    types: [opened, edited, reopened]

# One run per issue; a newer edit replaces a run still in progress.
concurrency:
  group: profile-submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  submit:
    # Only open profile issues, from people with access to the repository.
    if: >-
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.labels.*.name, 'new-member') ||
       contains(github.event.issue.labels.*.name, 'profile-update') ||
       contains(github.event.issue.labels.*.name, 'add-papers') ||
       startsWith(github.event.issue.title, 'New lab member') ||
       startsWith(github.event.issue.title, 'Profile update') ||
       startsWith(github.event.issue.title, 'Add papers')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # push the profile/issue-N branch
      pull-requests: write     # open the pull request
      issues: write            # comment and label
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
      # "papers" for an Add papers issue, "update" for Update my profile, otherwise "new"
      SUBMISSION_KIND: ${{ (contains(github.event.issue.labels.*.name, 'add-papers') || startsWith(github.event.issue.title, 'Add papers')) && 'papers' || ((contains(github.event.issue.labels.*.name, 'profile-update') || startsWith(github.event.issue.title, 'Profile update')) && 'update' || 'new') }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      # Only needed if GitHub won't let the workflow's own token read issue
      # attachments; the issue comment says so if that happens.
      INTAKE_TOKEN: ${{ secrets.INTAKE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the issue
        id: fetch
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/profile-issue.py fetch

      - name: Check the submission
        id: check
        if: steps.fetch.outputs.lane != ''
        run: python3 scripts/profile-issue.py check

      - name: Make the change on a branch
        if: steps.check.outputs.ok == 'true'
        run: |
          branch="profile/issue-$ISSUE_NUMBER"
          git switch -c "$branch"
          python3 scripts/profile-issue.py apply
          # Make sure the site still builds with the change. docs/ itself is
          # left out of the pull request: it's rebuilt once this is merged,
          # so two people's pull requests can't collide in the generated pages.
          python3 scripts/build-site.py
          git checkout -- docs
          git clean -fdq docs
          git add -A content
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Profile change from issue #$ISSUE_NUMBER" \
                        -m "Via .github/workflows/profile-submission.yml."
          git push --force origin "$branch"

      - name: Open or update the pull request
        if: steps.check.outputs.ok == 'true'
        run: python3 scripts/profile-issue.py pr

      - name: Report back on the issue
        if: always()
        run: python3 scripts/profile-issue.py comment
