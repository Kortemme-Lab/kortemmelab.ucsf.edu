name: Update my profile
description: Change your profile on the lab website, add new papers, or tell us you're leaving the lab. Alumni too.
title: "Profile update: "
labels: ["profile-update"]
body:
  - type: markdown
    attributes:
      value: |
        Put your name in the title above, then do **one** of these.

        ## Just adding new papers?

        Fill in your name and the papers' DOIs below and click **Create**. You don't need the profile form.

        ## Changing anything else, or leaving the lab?

        1. **Download your current profile:** find your name among the
           [current members](https://github.com/blonn25/kortemmelab.ucsf.edu/tree/main/content/current-members)
           or [alumni](https://github.com/blonn25/kortemmelab.ucsf.edu/tree/main/content/alumni)
           (a file like `jane-doe.md`), open it, and click the **download** button (↓, top right).
        2. **Get the [profile form](https://github.com/blonn25/kortemmelab.ucsf.edu/blob/main/intake/profile-form.html)**
           the same way, and open the downloaded `profile-form.html` in your browser.
        3. In the form, choose **Update my profile** and pick the profile file you downloaded. Everything fills in.
           Change what you like: your position, summary, photo, papers. If you're leaving the lab, tick
           **I've left the lab, or I'm leaving it** and give the year and what you're doing next.
        4. Click **Save my profile**, and drag the `.zip` it gives you into the box below.

        A check runs straight away and replies on this issue, usually within two minutes. A website manager
        then reviews the change and publishes it.
  - type: input
    id: name
    attributes:
      label: Your name as it appears on the website
      placeholder: Jane Q. Doe
    validations:
      required: true
  - type: textarea
    id: dois
    attributes:
      label: New papers (DOIs)
      description: Just adding papers? One per line. A DOI (`10.1126/science.abc0881`), a doi.org link, or an arXiv ID (`arXiv:2204.13048`).
    validations:
      required: false
  - type: textarea
    id: profile
    attributes:
      label: Your updated profile .zip
      description: Changing anything else? Drag the `.zip` from the profile form into this box.
      placeholder: Drop your .zip here
    validations:
      required: false
  - type: checkboxes
    id: consent
    attributes:
      label: Publishing
      options:
        - label: I'm happy for my updated profile to be published on the lab website.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else for the website manager?
      description: Optional.
    validations:
      required: false
