name: Update my profile
description: Change your profile on the lab website, or tell us you're leaving the lab. Current members and alumni.
title: "Profile update: "
labels: ["profile-update"]
body:
  - type: markdown
    attributes:
      value: |
        **Just adding new papers?** Use **Add papers** instead. It only needs your name and the DOIs.

        ## 1. Make your changes

        1. **Download your current profile:** find your name among the
           [current members](https://github.com/blonn25/kortemmelab.ucsf.edu/tree/main/content/current-members)
           or [alumni](https://github.com/blonn25/kortemmelab.ucsf.edu/tree/main/content/alumni)
           (a file like `jane-doe.md`), open it, and click the **download** button (↓, top right).
        2. **Get the [profile form](https://github.com/blonn25/kortemmelab.ucsf.edu/blob/main/intake/profile-form.html)**
           the same way, and open the downloaded `profile-form.html` in your browser.
        3. In the form, choose **Update my profile** and pick the profile file you downloaded. Everything fills in.
           Change what you like: your position, summary, photo, links, papers. If you're leaving the lab,
           tick **I've left the lab, or I'm leaving it** and give the year and what you're doing next.
        4. Click **Save my profile**. You'll get one file, `your-name-profile-update.zip`.

        ## 2. Attach it here

        Put your name in the title above, drag the `.zip` into the box below, and click **Create**.
        A check runs straight away and replies on this issue, usually within two minutes. A website
        manager then reviews the change and publishes it.
  - type: textarea
    id: profile
    attributes:
      label: Your updated profile .zip
      description: Drag `your-name-profile-update.zip` into this box, or click here and then the paperclip to attach it.
      placeholder: Drop your .zip here
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Publishing
      options:
        - label: I'm happy for my updated profile, including my photo, to be published on the lab website.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else for the website manager?
      description: Optional.
    validations:
      required: false
