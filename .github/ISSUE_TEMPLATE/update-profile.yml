name: Update my profile
description: Add papers to your profile on the lab website, change anything on it, or tell us you're leaving the lab. Current members and alumni.
title: "Profile update: "
labels: ["profile-update"]
body:
  - type: markdown
    attributes:
      value: |
        ## 1. Make your changes

        1. **[Open the profile form](https://kortemme-lab.github.io/kortemmelab.ucsf.edu/profile-form.html)** (it opens in your browser; bookmark it for later),
           choose **Update my profile**, and pick your name. Everything fills in from your profile on the website.
        2. Change what you like: add new papers (from ORCID, or by DOI), or change your position, summary,
           photo or links. If a new paper is the published version of a preprint, the form asks whether it
           replaces the preprint. If you're leaving the lab, tick **I've left the lab, or I'm leaving it**
           and give the year and what you're doing next.
        3. Click **Save my profile**. You'll get one file, `your-name-profile-update.zip`.

        ## 2. Attach it here

        Put your name in the title above, drag the `.zip` into the box below, and click **Create**.
        A check runs straight away and replies on this issue, usually within two minutes. A website
        manager then reviews the change and publishes it.
  - type: textarea
    id: profile
    attributes:
      label: Your updated profile .zip
      description: Drag `your-name-profile-update.zip` into this box, or click here and then the paperclip to attach it.
      placeholder: Drop your .zip here
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Publishing
      options:
        - label: I'm happy for my updated profile, including my photo, to be published on the lab website.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else for the website manager?
      description: Optional.
    validations:
      required: false
