name: Add papers
description: Add new papers to your profile on the lab website, by DOI. Current members and alumni.
title: "Add papers: "
labels: ["add-papers"]
body:
  - type: markdown
    attributes:
      value: |
        Put your name in the title above, fill in the two boxes below, and click **Create**.
        A check replies on this issue within a couple of minutes. A website manager then
        adds the papers to your profile.
  - type: input
    id: name
    attributes:
      label: Your name as it appears on the website
      placeholder: Jane Q. Doe
    validations:
      required: true
  - type: textarea
    id: dois
    attributes:
      label: Papers to add (DOIs)
      description: >-
        One per line. A DOI (`10.1126/science.abc0881`), a doi.org link, or an arXiv ID
        (`arXiv:2204.13048`). Each one is checked; any already on your profile are skipped.
      placeholder: |
        10.1126/science.abc0881
        https://doi.org/10.1101/2025.06.02.657515
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else for the website manager?
      description: Optional.
    validations:
      required: false
